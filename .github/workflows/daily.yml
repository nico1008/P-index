name: Daily fetch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetchers
        run: node scripts/fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/sources.json; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git add data/sources.json
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(data): refresh ${DATE}"
          git push
